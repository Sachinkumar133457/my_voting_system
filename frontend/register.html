<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | VoteNow</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <!-- Google Identity Services Script -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="index.html" class="logo" style="text-decoration: none; color: inherit;">
                <img src="vote.jpeg" alt="VoteNow Logo">
                <div class="logo-text">
                    <h2>VoteNow</h2>
                    <p>Online Voting System</p>
                </div>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="process.html">Voting Process</a></li>
                <li><a href="features.html">Features</a></li>
                <li><a href="results.html">Results</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <div class="buttons">
                <a href="login.html" class="login-btn"><i class="fa-regular fa-user"></i> Login</a>
                <a href="register.html" class="register-btn active-nav-btn"><i class="fa-solid fa-user-plus"></i> Register</a>
            </div>
        </nav>
    </header>

    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-left">
                <h2>Create Account</h2>
                <p>Join our secure voting system</p>
                <img src="vote2.jpeg" alt="Secure Shield" class="auth-vector">
            </div>
            <div class="auth-right">
                <h3>Register</h3>
                <form class="auth-form" id="registerForm">
                    <div class="input-group">
                        <label>Full Name</label>
                        <input type="text" id="regName" placeholder="Full Name" required>
                    </div>
                    
                    <div class="input-group">
                        <label>Email Address</label>
                        <div class="otp-input-wrapper">
                            <input type="email" id="regEmail" placeholder="Enter Gmail Address" required>
                            <button type="button" class="send-otp-btn" id="sendOtpBtn">Send OTP</button>
                        </div>
                    </div>

                    <div class="input-group" id="otpGroup" style="display: none;">
                        <label>Email OTP</label>
                        <input type="text" id="regOtp" maxlength="6" placeholder="Enter 6-digit OTP">
                        <small id="otpStatusText" style="color: #047857; font-size: 11px; font-weight: 600;"></small>
                    </div>

                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" id="regPassword" placeholder="Create Password" required>
                    </div>

                    <button type="submit" class="auth-submit-btn" id="registerSubmitBtn">Verify & Register</button>
                    
                    <!-- Google Sign-In Button Container -->
                    <div class="input-group" style="text-align: center; margin-top: 15px;">
                        <div id="googleSignInBtn" style="display: flex; justify-content: center; width: 100%;"></div>
                    </div>

                    <p class="auth-footer-text">Already have an account? <a href="login.html">Login</a></p>
                </form>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
